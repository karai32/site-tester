name: Deploy to production

# Выкладка на сервер при каждом пуше в main.
# Сервис: /opt/808-checker, данные: /var/lib/808-checker, настройки сервера — папка deploy/.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 109.235.116.46
      DEPLOY_USER: root

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H -T 10 "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      # Перезапуск прервал бы идущую проверку
      - name: Check that no check is running
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'if curl --silent http://127.0.0.1:3001/health | grep -q "\"checkRunning\":true"; then echo "A check is running. Deployment cancelled, run it again later."; exit 1; fi'

      - name: Upload application
        run: |
          tar -czf release.tgz src public scripts ui-kit deploy package.json package-lock.json
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes release.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/808-checker-release.tgz"

      - name: Install and restart
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu

            # Новая версия собирается в отдельной папке и потом подменяет текущую
            rm -rf /opt/808-checker.new
            mkdir /opt/808-checker.new
            tar -xzf /tmp/808-checker-release.tgz -C /opt/808-checker.new
            rm /tmp/808-checker-release.tgz
            cd /opt/808-checker.new
            npm ci --omit=dev
            find src scripts -type f -name "*.js" -print0 | xargs -0 -n1 node --check

            # Браузер для тестов. Скачивается, только если сменилась версия Playwright.
            runuser -u checker -- env HOME=/var/lib/808-checker PLAYWRIGHT_BROWSERS_PATH=/var/lib/808-checker/pw-browsers \
              node node_modules/playwright/cli.js install chromium

            # Настройки сервера из папки deploy
            install -m 644 deploy/808-checker.service /etc/systemd/system/808-checker.service
            install -m 644 deploy/808-checker.env /etc/808-checker.env
            install -m 644 deploy/cron /etc/cron.d/808-checker
            systemctl daemon-reload
            systemctl enable 808-checker.service

            # Подмена версии и перезапуск
            rm -rf /opt/808-checker.old
            if [ -d /opt/808-checker ]; then mv /opt/808-checker /opt/808-checker.old; fi
            mv /opt/808-checker.new /opt/808-checker
            systemctl restart 808-checker.service

            for attempt in $(seq 1 15); do
              if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
                echo "Deployment completed successfully."
                exit 0
              fi
              sleep 1
            done

            systemctl status 808-checker.service --no-pager
            exit 1
          '
