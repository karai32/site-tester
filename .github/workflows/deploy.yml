name: Deploy to production

# При каждом пуше в main: собрать образ, положить в ghcr.io и перезапустить контейнер на сервере.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/karai32/site-tester:latest
            ghcr.io/karai32/site-tester:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEPLOY_HOST: 109.235.116.46
      DEPLOY_USER: root

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H -T 10 "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      # Перезапуск прервал бы идущую проверку
      - name: Check that no check is running
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'if curl --silent http://127.0.0.1:3001/health | grep -q "\"checkRunning\":true"; then echo "A check is running. Deployment cancelled, run it again later."; exit 1; fi'

      - name: Upload docker-compose.yml
        run: |
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/808-checker-docker/docker-compose.yml"

      - name: Pull image and restart
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            cd /opt/808-checker-docker
            docker compose pull
            docker compose up -d
            docker image prune -f

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
                echo "Deployment completed successfully."
                exit 0
              fi
              sleep 1
            done

            docker compose logs --tail 50
            exit 1
          '
