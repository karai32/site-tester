# nginx: адрес audit.808-test.ru -> сервис на порту 3001.
# На сервере: /etc/nginx/sites-available/audit.808-test.ru (ссылка в sites-enabled).
# Сертификат выпускает и продлевает certbot, строки «managed by Certbot» он добавил сам.
# После правки: nginx -t && systemctl reload nginx

server {
    server_name audit.808-test.ru;

    # Самый большой загружаемый файл - аватарка проекта до 2 МБ (по умолчанию nginx пускает только 1 МБ)
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/audit.808-test.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/audit.808-test.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = audit.808-test.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name audit.808-test.ru;
    return 404; # managed by Certbot
}
